<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8B5E3C">

<title>KIVOO — Discover what inspires you</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   KIVOO DESIGN SYSTEM
========================================================= */

:root{
  --brown:#8B5E3C;
  --brown-dark:#63412b;
  --brown-light:#b98962;
  --cream:#f7f3ee;
  --cream-2:#eee6dc;
  --white:#ffffff;
  --black:#211a15;
  --gray:#756b63;
  --line:#e8dfd6;
  --shadow:0 15px 45px rgba(74,48,30,.10);
  --shadow-soft:0 8px 25px rgba(74,48,30,.08);
  --radius:22px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color:var(--black);
  background:var(--cream);
  min-height:100vh;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

.hidden{
  display:none!important;
}

/* =========================================================
   BACKGROUND DECOR
========================================================= */

body::before{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(185,137,98,.09);
  top:-180px;
  left:-150px;
  pointer-events:none;
  z-index:-1;
}

body::after{
  content:"";
  position:fixed;
  width:350px;
  height:350px;
  border-radius:50%;
  background:rgba(139,94,60,.06);
  bottom:-170px;
  right:-120px;
  pointer-events:none;
  z-index:-1;
}

/* =========================================================
   AUTH
========================================================= */

#authPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:
    radial-gradient(circle at 15% 20%,rgba(185,137,98,.17),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(139,94,60,.10),transparent 30%),
    var(--cream);
}

.auth-card{
  width:100%;
  max-width:450px;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(139,94,60,.12);
  border-radius:32px;
  padding:42px 34px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(15px);
}

.brand{
  text-align:center;
  font-size:42px;
  font-weight:950;
  letter-spacing:-3px;
  color:var(--brown);
}

.brand-subtitle{
  text-align:center;
  color:var(--gray);
  font-size:14px;
  margin-top:7px;
  margin-bottom:30px;
}

.auth-tabs{
  display:flex;
  padding:5px;
  background:var(--cream);
  border-radius:16px;
  margin-bottom:24px;
}

.auth-tabs button{
  flex:1;
  border:0;
  padding:12px;
  border-radius:12px;
  background:transparent;
  color:var(--gray);
  font-weight:700;
  transition:.2s;
}

.auth-tabs button.active{
  background:var(--white);
  color:var(--brown);
  box-shadow:var(--shadow-soft);
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:750;
  margin-bottom:7px;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fcfaf8;
  color:var(--black);
  outline:none;
  padding:14px 15px;
  border-radius:15px;
  transition:.2s;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--brown-light);
  background:white;
  box-shadow:0 0 0 4px rgba(139,94,60,.08);
}

.primary-btn{
  width:100%;
  border:0;
  background:var(--brown);
  color:white;
  padding:14px 18px;
  border-radius:15px;
  font-weight:800;
  transition:.2s;
  box-shadow:0 7px 20px rgba(139,94,60,.18);
}

.primary-btn:hover{
  background:var(--brown-dark);
  transform:translateY(-1px);
}

.primary-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

.auth-message{
  min-height:20px;
  margin-top:13px;
  text-align:center;
  font-size:13px;
}

/* =========================================================
   APP HEADER
========================================================= */

#app{
  display:none;
}

.topbar{
  position:sticky;
  top:0;
  z-index:80;
  height:78px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 25px;
  background:rgba(247,243,238,.90);
  border-bottom:1px solid rgba(139,94,60,.10);
  backdrop-filter:blur(18px);
}

.header-brand{
  font-size:30px;
  font-weight:950;
  letter-spacing:-2px;
  color:var(--brown);
  flex-shrink:0;
}

.search-wrap{
  position:relative;
  flex:1;
  max-width:760px;
  margin:auto;
}

.search-icon{
  position:absolute;
  left:17px;
  top:50%;
  transform:translateY(-50%);
  color:var(--brown);
  pointer-events:none;
}

.search-input{
  width:100%;
  border:1px solid transparent;
  outline:none;
  background:#ebe4dc;
  border-radius:18px;
  padding:14px 18px 14px 48px;
  color:var(--black);
  transition:.2s;
}

.search-input:focus{
  background:white;
  border-color:var(--brown-light);
  box-shadow:0 0 0 4px rgba(139,94,60,.07);
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.round-btn{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:transparent;
  color:var(--black);
  border-radius:50%;
  transition:.2s;
}

.round-btn:hover{
  background:var(--cream-2);
  color:var(--brown);
}

.create-btn{
  border:0;
  background:var(--brown);
  color:white;
  padding:12px 18px;
  border-radius:15px;
  font-weight:800;
  box-shadow:0 6px 18px rgba(139,94,60,.15);
  transition:.2s;
}

.create-btn:hover{
  background:var(--brown-dark);
  transform:translateY(-1px);
}

.user-avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:var(--brown);
  color:white;
  font-weight:900;
  cursor:pointer;
  border:3px solid white;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.user-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =========================================================
   NAV
========================================================= */

.main-nav{
  max-width:1500px;
  margin:auto;
  padding:13px 25px 3px;
  display:flex;
  gap:7px;
}

.nav-btn{
  border:0;
  background:transparent;
  color:var(--gray);
  padding:10px 17px;
  border-radius:14px;
  font-weight:750;
  transition:.2s;
}

.nav-btn:hover{
  color:var(--brown);
  background:rgba(139,94,60,.07);
}

.nav-btn.active{
  background:var(--brown);
  color:white;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  max-width:1550px;
  margin:auto;
  padding:10px 25px 70px;
}

.hero{
  text-align:center;
  padding:45px 15px 35px;
}

.hero-kicker{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--brown);
  font-weight:800;
  font-size:13px;
  background:rgba(139,94,60,.08);
  border:1px solid rgba(139,94,60,.10);
  padding:8px 13px;
  border-radius:30px;
  margin-bottom:15px;
}

.hero h1{
  font-size:clamp(32px,5vw,58px);
  line-height:1.05;
  letter-spacing:-3px;
  margin-bottom:12px;
}

.hero h1 span{
  color:var(--brown);
}

.hero p{
  color:var(--gray);
  max-width:560px;
  margin:auto;
  line-height:1.7;
}

/* =========================================================
   MASONRY
========================================================= */

.pin-grid{
  columns:5 220px;
  column-gap:18px;
}

.pin-card{
  break-inside:avoid;
  margin-bottom:19px;
  cursor:pointer;
  position:relative;
}

.pin-image-wrap{
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:var(--cream-2);
}

.pin-image{
  display:block;
  width:100%;
  height:auto;
  transition:transform .35s ease,filter .35s ease;
}

.pin-card:hover .pin-image{
  transform:scale(1.025);
  filter:brightness(.91);
}

.pin-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:13px;
  opacity:0;
  transition:.25s;
  background:linear-gradient(transparent 55%,rgba(25,17,12,.48));
}

.pin-card:hover .pin-overlay{
  opacity:1;
}

.pin-save{
  border:0;
  background:white;
  color:var(--brown);
  padding:9px 13px;
  border-radius:12px;
  font-weight:850;
  box-shadow:0 5px 16px rgba(0,0,0,.13);
}

.pin-likes-overlay{
  color:white;
  font-weight:800;
  font-size:13px;
}

.pin-info{
  padding:10px 4px 4px;
}

.pin-title{
  font-size:15px;
  font-weight:850;
  line-height:1.3;
}

.pin-description{
  margin-top:5px;
  color:var(--gray);
  font-size:13px;
  line-height:1.45;
}

.pin-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:8px;
  color:var(--gray);
  font-size:12px;
}

.pin-likes{
  color:var(--brown);
  font-weight:800;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty{
  column-span:all;
  text-align:center;
  padding:80px 20px;
  color:var(--gray);
}

.empty-icon{
  font-size:46px;
  margin-bottom:12px;
}

.empty h2{
  color:var(--black);
  margin-bottom:7px;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(31,23,18,.62);
  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modal-card{
  position:relative;
  width:100%;
  max-width:1080px;
  max-height:94vh;
  overflow:auto;
  background:white;
  border-radius:27px;
  box-shadow:0 30px 90px rgba(0,0,0,.25);
}

.close-btn{
  position:absolute;
  right:15px;
  top:15px;
  z-index:5;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.95);
  color:var(--black);
  font-size:23px;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.close-btn:hover{
  color:var(--brown);
}

/* =========================================================
   PIN DETAIL
========================================================= */

.pin-detail{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(350px,.8fr);
}

.detail-image-area{
  min-height:550px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee7df;
}

.detail-image{
  width:100%;
  max-height:82vh;
  object-fit:contain;
}

.detail-content{
  padding:58px 36px 30px;
}

.detail-title{
  font-size:clamp(25px,4vw,37px);
  line-height:1.1;
  letter-spacing:-1px;
}

.detail-user{
  margin-top:10px;
  color:var(--gray);
  font-size:13px;
}

.detail-description{
  color:#5e554e;
  line-height:1.8;
  margin:18px 0;
  white-space:pre-wrap;
}

.detail-stats{
  display:flex;
  gap:15px;
  color:var(--gray);
  font-size:14px;
  font-weight:700;
  margin:15px 0;
}

.detail-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:20px 0 28px;
}

.action-btn{
  border:1px solid var(--line);
  background:white;
  color:var(--black);
  padding:12px 16px;
  border-radius:14px;
  font-weight:800;
  transition:.2s;
}

.action-btn:hover{
  border-color:var(--brown-light);
  color:var(--brown);
  background:var(--cream);
}

.action-btn.save{
  background:var(--brown);
  border-color:var(--brown);
  color:white;
}

.action-btn.save:hover{
  background:var(--brown-dark);
  color:white;
}

.action-btn.download{
  background:var(--cream);
  color:var(--brown);
  border-color:transparent;
}

.action-btn.liked{
  color:#b13e48;
  background:#fff0f1;
  border-color:#f1c8cc;
}

/* =========================================================
   COMMENTS
========================================================= */

.comments-heading{
  font-size:16px;
  margin-bottom:12px;
}

.comments-list{
  max-height:220px;
  overflow:auto;
}

.comment{
  padding:10px 0;
  border-bottom:1px solid var(--line);
}

.comment strong{
  font-size:13px;
}

.comment p{
  margin-top:4px;
  color:var(--gray);
  font-size:14px;
  line-height:1.5;
}

.comment-form{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.comment-form input{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
  outline:none;
}

.comment-form button{
  border:0;
  border-radius:14px;
  padding:0 17px;
  background:var(--brown);
  color:white;
  font-weight:800;
}

/* =========================================================
   CREATE
========================================================= */

.create-card{
  max-width:650px;
  padding:38px;
}

.create-card h2{
  font-size:27px;
  margin-bottom:6px;
}

.create-subtitle{
  color:var(--gray);
  margin-bottom:22px;
  font-size:14px;
}

.upload-box{
  min-height:280px;
  border:2px dashed #d6c8bb;
  background:#faf7f3;
  border-radius:21px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  cursor:pointer;
  margin-bottom:20px;
  text-align:center;
  transition:.2s;
}

.upload-box:hover{
  border-color:var(--brown);
  background:#f8f2ec;
}

.upload-placeholder{
  padding:35px;
  color:var(--gray);
}

.upload-icon{
  width:65px;
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 13px;
  border-radius:20px;
  background:rgba(139,94,60,.10);
  color:var(--brown);
  font-size:30px;
}

.preview{
  display:none;
  width:100%;
  max-height:500px;
  object-fit:contain;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-header{
  text-align:center;
  padding:45px 20px 30px;
}

.profile-avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  background:var(--brown);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin:auto;
  font-size:38px;
  font-weight:900;
  border:5px solid white;
  box-shadow:var(--shadow-soft);
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-header h1{
  margin-top:14px;
  font-size:28px;
}

.profile-username{
  color:var(--brown);
  margin-top:4px;
  font-weight:700;
}

.profile-bio{
  max-width:500px;
  margin:10px auto;
  color:var(--gray);
  line-height:1.6;
}

.logout-btn{
  border:1px solid var(--line);
  background:white;
  color:var(--brown);
  padding:10px 17px;
  border-radius:13px;
  font-weight:800;
  margin-top:12px;
}

/* =========================================================
   TOAST
========================================================= */

#toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:400;
  transform:translate(-50%,100px);
  opacity:0;
  background:var(--black);
  color:white;
  padding:13px 19px;
  border-radius:15px;
  box-shadow:var(--shadow);
  transition:.3s;
  font-size:14px;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

  .topbar{
    padding:0 15px;
    gap:10px;
  }

  .header-brand{
    font-size:26px;
  }

  .pin-grid{
    columns:3 180px;
  }

  .pin-detail{
    grid-template-columns:1fr;
  }

  .detail-image-area{
    min-height:350px;
  }

}

@media(max-width:650px){

  .topbar{
    height:auto;
    min-height:68px;
    flex-wrap:wrap;
    padding:10px;
  }

  .header-brand{
    font-size:25px;
  }

  .search-wrap{
    order:3;
    flex-basis:100%;
    max-width:none;
  }

  .header-actions{
    margin-left:auto;
  }

  .create-btn{
    padding:10px 13px;
  }

  .main-nav{
    overflow-x:auto;
    padding:9px 10px;
  }

  .nav-btn{
    white-space:nowrap;
    padding:9px 13px;
  }

  .main{
    padding:0 10px 50px;
  }

  .hero{
    padding:32px 10px 25px;
  }

  .hero h1{
    letter-spacing:-2px;
  }

  .pin-grid{
    columns:2 140px;
    column-gap:10px;
  }

  .pin-card{
    margin-bottom:12px;
  }

  .pin-image-wrap{
    border-radius:15px;
  }

  .pin-overlay{
    display:none;
  }

  .pin-info{
    padding:7px 2px;
  }

  .pin-title{
    font-size:13px;
  }

  .pin-description{
    font-size:11px;
  }

  .detail-content{
    padding:50px 20px 25px;
  }

  .detail-image-area{
    min-height:290px;
  }

  .detail-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .action-btn{
    width:100%;
  }

  .create-card{
    padding:30px 18px;
  }

  .auth-card{
    padding:32px 20px;
  }

}

@media(max-width:380px){

  .pin-grid{
    columns:2 125px;
  }

  .header-brand{
    font-size:23px;
  }

  .user-avatar,
  .round-btn{
    width:40px;
    height:40px;
  }

}
</style>
</head>

<body>

<!-- ========================================================
AUTH
========================================================= -->

<section id="authPage">

<div class="auth-card">

<div class="brand">KIVOO</div>

<div class="brand-subtitle">
Discover ideas. Save inspiration. Create your world.
</div>

<div class="auth-tabs">

<button
id="loginTab"
class="active"
onclick="showAuth('login')">
Sign in
</button>

<button
id="signupTab"
onclick="showAuth('signup')">
Create account
</button>

</div>

<form id="loginForm">

<div class="field">
<label>Email address</label>
<input
id="loginEmail"
type="email"
required
placeholder="you@example.com">
</div>

<div class="field">
<label>Password</label>
<input
id="loginPassword"
type="password"
required
placeholder="Your password">
</div>

<button class="primary-btn">
Sign in to KIVOO
</button>

</form>

<form
id="signupForm"
style="display:none">

<div class="field">
<label>Username</label>
<input
id="signupUsername"
required
minlength="3"
maxlength="30"
placeholder="yourusername">
</div>

<div class="field">
<label>Display name</label>
<input
id="signupDisplayName"
required
placeholder="Your name">
</div>

<div class="field">
<label>Email address</label>
<input
id="signupEmail"
type="email"
required
placeholder="you@example.com">
</div>

<div class="field">
<label>Password</label>
<input
id="signupPassword"
type="password"
minlength="6"
required
placeholder="At least 6 characters">
</div>

<button class="primary-btn">
Create my KIVOO account
</button>

</form>

<div
id="authMessage"
class="auth-message">
</div>

</div>
</section>


<!-- ========================================================
APP
========================================================= -->

<div id="app">

<header class="topbar">

<div class="header-brand">
KIVOO
</div>

<div class="search-wrap">

<span class="search-icon">⌕</span>

<input
id="searchInput"
class="search-input"
placeholder="Search ideas, images and inspiration...">

</div>

<div class="header-actions">

<button
class="round-btn"
title="Home"
onclick="loadHome()">
⌂
</button>

<button
class="create-btn"
onclick="openCreate()">
＋ Create
</button>

<div
id="headerAvatar"
class="user-avatar"
onclick="showProfile()">
K
</div>

</div>

</header>


<nav class="main-nav">

<button

/* =========================================================
ADD LIKE / SAVE COUNTS
========================================================= */

async function addCounts(pins){

if(!pins.length)
return [];


const ids=
pins.map(p=>p.id);


const {data:likes}=
await db
.from("likes")
.select("pin_id")
.in("pin_id",ids);


const {data:saves}=
await db
.from("saved_pins")
.select("pin_id")
.in("pin_id",ids);


return pins.map(pin=>({

...pin,

likeCount:
(likes||[])
.filter(x=>x.pin_id===pin.id)
.length,

saveCount:
(saves||[])
.filter(x=>x.pin_id===pin.id)
.length

}));

}

const blob=

const a=

a.download=

currentPin.title||"KIVOO-image"
)+"."+getExtension(currentPin.image_url);

}catch(error){

currentPin.image_url,
"_blank"
);

}

}

.toLowerCase();

.storage
.from("pins")
.upload(

selectedFile,
{

upsert:false,
contentType:selectedFile.type
}
);

);

.getPublicUrl(path);

await db
.from("pins")
.insert({

user_id:currentUser.id,
title,
description,
image_url:imageUrl

});


if(pinError){

await db
.storage
.from("pins")
.remove([path]);

throw new Error(
"Could not create Pin: "+
pinError.message
);

}


closeModal("createModal");

showToast("Your Pin is live.");

await loadHome();


}catch(error){

showToast(error.message);

currentProfile?.bio||"";


const avatar=
document.getElementById("profileAvatar");


if(currentProfile?.avatar_url){

avatar.innerHTML=
`<img src="${safe(currentProfile.avatar_url)}">`;

}else{

avatar.textContent=
initial(currentProfile?.display_name||"K");

}


const {data}=
await db
.from("pins")
.select(`
*,
profiles(
username,
display_name,
avatar_url
)
`)
.eq("user_id",currentUser.id)
.order("created_at",{ascending:false});


const pins=
await addCounts(data||[]);

renderPins(
document.getElementById("profilePins"),
pins
);


document
.getElementById("profileModal")
.classList.add("show");

}


/* =========================================================
LOGOUT
========================================================= */

async function logout(){

await db.auth.signOut();

currentUser=null;
currentProfile=null;

document.getElementById("app")
.style.display="none";

document.getElementById("authPage")
.style.display="flex";

showAuth("login");

}


/* =========================================================
SESSION
========================================================= */

async function checkSession(){

const {data}=
await db.auth.getSession();

if(data.session?.user){

currentUser=data.session.user;

await startApp();

}

}

checkSession();


/* =========================================================
UTILITIES
========================================================= */

function setNav(id){

document
.querySelectorAll(".nav-btn")
.forEach(button=>
button.classList.remove("active")
);

if(id){

document
.getElementById(id)
.classList.add("active");

}

}


function closeModal(id){

document
.getElementById(id)
.classList.remove("show");

}


document
.querySelectorAll(".modal")
.forEach(modal=>{

modal.addEventListener("click",e=>{

if(e.target===modal){

modal.classList.remove("show");

}

});

});


function initial(value){

return String(value||"K")
.trim()
.charAt(0)
.toUpperCase();

}


function safe(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function getExtension(url){

try{

const pathname=
new URL(url).pathname;

const ext=
pathname.split(".").pop().toLowerCase();

if(
["jpg","jpeg","png","webp","gif","avif"]
.includes(ext)
){

return ext;

}

}catch(e){}

return "jpg";

}


function cleanFileName(value){

return String(value)
.replace(/[\\/:*?"<>|]/g,"-")
.trim()
.substring(0,80);

}


function showToast(message){

const toast=
document.getElementById("toast");

toast.textContent=message;

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove("show");

},3000);

}


function varColor(name){

if(name==="gray")
return "#756b63";

return "#211a15";

}
